[project]
name = "household-chores"
version = "0.1.0"
description = "A recurring-due chore board for a shared household"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
