{% extends "base.html" %}
{% block title %}{% if chore %}Edit {{ chore.name }}{% else %}New chore{% endif %}{% endblock %}

{% block content %}
<h1>{% if chore %}Edit {{ chore.name }}{% else %}New chore{% endif %}</h1>

<form method="post" class="chore-form">
  {% csrf_token %}
  {{ form.as_p }}
  <p class="form-actions">
    <button type="submit">Save</button>
    <a href="{% url 'chores:chore_list' %}">Cancel</a>
  </p>
</form>
{% endblock %}
